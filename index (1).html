<div id="app"></div>
<script type="module">
import{OBR,KL,KC,POPS,POS,XY,WH,UIK,SDK,LIM,lsGet,lsSet,E,norm,SKA,vit,ar,pubDe,cfgSala,lerG,salvarG,pidSan,meuPid,ctxMestre,ctxJog,ctxTodos,conectar,put,patch,del,img,putImg,rolar,anunciar,diag,abrirPop}from"./lib.js";
const $=s=>document.querySelector(s),app=$("#app"),Q=new URLSearchParams(location.search);
const AT={fis:"Físico",men:"Mente",emo:"Emoção"},EL={Sangue:"#c8232c",Conhecimento:"#d89a12",Energia:"#a855f7",Morte:"#8c8c8c",Medo:"#3b2fd6"},col=o=>EL[o.elem]||"#8a94a0",KN={chars:"Jogadores",monstros:"Monstros",npcs:"NPCs"};
const abrir=(k,id,n,p)=>abrirPop(`v=f&k=${k}&id=${encodeURIComponent(id)}&n=${encodeURIComponent(n||"")}&p=${encodeURIComponent(p||"")}`);
const RULES=`{\n  "rules": {\n    "mesas": {\n      "$mesa": {\n        ".read": true,\n        ".write": true\n      }\n    }\n  }\n}`;

/* ===================== POPUP DA FICHA ===================== */
async function ficha(){
const k=Q.get("k"),id=Q.get("id"),n=Q.get("n"),pj=pidSan(Q.get("p")),K=k==="pj"?"chars":k,ch=K==="chars",own=Q.get("i")==="b"?1:0;
let c=null,R={},o=null,ph="",pf=0,ok=0,mini=0,h0=0;
/* barra fixa: fica visível em QUALQUER estado (carregando, erro, ficha não encontrada) */
app.innerHTML=`<div class="tp" title="Arraste a barra para mover"><b>${E(n)||"Ficha"}</b><button data-dock="L" title="Encaixar à esquerda" aria-label="Encaixar à esquerda">⇤</button><button data-dock="R" title="Encaixar à direita" aria-label="Encaixar à direita">⇥</button><button data-dock="" title="Abrir perto do token" aria-label="Abrir perto do token">◎</button><button data-min title="Minimizar" aria-label="Minimizar">–</button><button data-x title="Fechar (Esc)" aria-label="Fechar">×</button></div><div id="bd"><p class="pad">Carregando…</p></div><i class="rz br" data-rz="br" title="Arraste para redimensionar (duplo clique: tamanho padrão)"></i><i class="rz r" data-rz="r"></i><i class="rz b" data-rz="b"></i><i class="rz bl" data-rz="bl"></i><i class="rz l" data-rz="l"></i>`;
document.body.classList.add("pop");
const corpo=h=>{$("#bd").innerHTML=h},fechar=()=>OBR.popover.close(POPS[own]);
addEventListener("keydown",e=>{if(e.key==="Escape")fechar()});
const AX=+Q.get("ax")||12,AY=+Q.get("ay")||12,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const qBase=()=>{const u=new URLSearchParams(location.search);["i","ax","ay"].forEach(x=>u.delete(x));return u.toString()};
/* a interface (DT, passos, bônus, última rolagem) sobrevive à reabertura em outra posição */
const guardaUI=()=>{try{lsSet(UIK,{t:Date.now(),k,id,dt:($("#dt")||{}).value||"",kk:($("#kk")||{}).value||"0",bx:($("#bx")||{}).value||"",oc:!!($("#oc")||{}).checked,lr:($("#lr")||{}).innerHTML||""})}catch{}};
const restauraUI=()=>{const u=lsGet(UIK,null);if(!u||u.k!==k||u.id!==id||Date.now()-u.t>20000)return;lsSet(UIK,null);$("#dt").value=u.dt;$("#kk").value=u.kk;$("#bx").value=u.bx;$("#oc").checked=!!u.oc;$("#lr").innerHTML=u.lr};
let vp=null;Promise.all([OBR.viewport.getWidth(),OBR.viewport.getHeight()]).then(v=>vp=v).catch(()=>{});
/* contorno na tela enquanto arrasta (item local do Owlbear: só você vê e não é salvo) */
const G={id:null,busy:0,next:null,off:0};
const pintaG=async r=>{const{buildShape}=await SDK;if(!buildShape)return;const sc=(await OBR.viewport.getScale())||1,p=await OBR.viewport.inverseTransformPoint({x:r.left,y:r.top});
if(!G.id){const sh=buildShape().shapeType("RECTANGLE").width(r.w/sc).height(r.h/sc).position(p).fillColor("#86a9d3").fillOpacity(.18).strokeColor("#86a9d3").strokeWidth(3/sc).layer("CONTROL").disableHit(true).locked(true).build();G.id=sh.id;await OBR.scene.local.addItems([sh])}
else await OBR.scene.local.updateItems([G.id],it=>{it[0].position=p;it[0].width=r.w/sc;it[0].height=r.h/sc})};
const guia=r=>{G.next=r;if(G.busy)return;G.busy=1;(async()=>{try{while(G.next&&!G.off){const x=G.next;G.next=null;await pintaG(x)}}catch{}G.busy=0})()};
const guiaFim=async()=>{G.off=1;G.next=null;while(G.busy)await new Promise(r=>setTimeout(r,15));const i=G.id;G.id=null;if(i)try{await OBR.scene.local.deleteItems([i])}catch{}};
/* tamanho ao vivo pela API oficial (setWidth/setHeight) */
const T={busy:0,next:null};
const tam=(w,h)=>{T.next=[w,h];if(T.busy)return;T.busy=1;(async()=>{try{while(T.next){const[a,b]=T.next;T.next=null;await OBR.popover.setWidth(POPS[own],a);await OBR.popover.setHeight(POPS[own],b)}}catch{}T.busy=0})()};
let dg=null;const titulo=t=>{const b=document.querySelector(".tp b");if(b)b.textContent=t};
app.addEventListener("pointerdown",e=>{if(e.button!==0||mini&&e.target.closest(".rz"))return;
const rz=e.target.closest(".rz"),tp=e.target.closest(".tp");if(!rz&&(!tp||e.target.closest("button")))return;
const[W,H]=vp||[innerWidth*3,innerHeight*2];try{e.target.setPointerCapture(e.pointerId)}catch{}
G.off=0;dg={k:rz?rz.dataset.rz:"move",x0:e.clientX,y0:e.clientY,w0:innerWidth,h0:innerHeight,W,H,moved:0,rect:null,pid:e.pointerId};if(!rz)tp.classList.add("dg")});
app.addEventListener("pointermove",e=>{if(!dg||e.pointerId!==dg.pid)return;const dx=e.clientX-dg.x0,dy=e.clientY-dg.y0,{k:m,w0,h0,W,H}=dg;
if(!dg.moved&&Math.abs(dx)+Math.abs(dy)>3){dg.moved=1;if(m==="move")titulo("Solte onde quer a ficha")}if(!dg.moved)return;
if(m==="move"){const r={left:cl(AX+dx,12,Math.max(12,W-w0-12)),top:cl(AY+dy,12,Math.max(12,H-h0-12)),w:w0,h:h0};dg.rect=r;guia(r)}
else if(m==="br"||m==="r"||m==="b"){const w=m==="b"?w0:cl(w0+dx,LIM.w,Math.max(LIM.w,W-AX-8)),h=m==="r"?h0:cl(h0+dy,LIM.h,Math.max(LIM.h,H-AY-8));dg.rect={left:AX,top:AY,w,h};tam(w,h)}
else{const right=AX+w0,left=cl(AX+dx,12,right-LIM.w),h=m==="bl"?cl(h0+dy,LIM.h,Math.max(LIM.h,H-AY-8)):h0,r={left,top:AY,w:right-left,h};dg.rect=r;guia(r)}});
const fim=async e=>{if(!dg||e.pointerId!==dg.pid)return;const d=dg;dg=null;document.querySelector(".tp").classList.remove("dg");try{e.target.releasePointerCapture(e.pointerId)}catch{}
const r=d.rect;if(d.k==="move"||d.k==="l"||d.k==="bl"){await guiaFim();titulo(o?o.nome||"Ficha":n||"Ficha");
if(d.moved&&r){lsSet(XY,{left:r.left,top:r.top});try{localStorage.setItem(POS,"F")}catch{}if(d.k!=="move")lsSet(WH,{w:r.w,h:r.h});guardaUI();try{await abrirPop(qBase(),undefined,own,r)}catch{}}}
else if(d.moved&&r)lsSet(WH,{w:r.w,h:r.h})};
app.addEventListener("pointerup",fim);app.addEventListener("pointercancel",fim);
app.addEventListener("dblclick",e=>{if(!e.target.closest(".rz.br")||!vp)return;lsSet(WH,null);tam(LIM.W0,Math.min(LIM.H0,vp[1]-24))});
addEventListener("pagehide",()=>{if(G.id)try{OBR.scene.local.deleteItems([G.id])}catch{}});
const go=(label,da,db,op={})=>{
const r=rolar(o,da,db,{...op,pc:ch,dt:+$("#dt").value||0,k:+$("#kk").value,bx:$("#bx").value});
if(ch){const u={};if(o.bonus)u.bonus="";if(r.pv===1)u.pav="";if(o.perfil==="Executor"&&(r.fail||(r.dt&&!r.ok))&&(+o.imp||0)<(+o.imx||3))u.imp=(+o.imp||0)+1;
if(Object.keys(u).length){Object.assign(o,u);patch(c,`${K}/${o.id||id}`,u)}}
$("#dt").value="";$("#bx").value="";
const cl=r.res?(r.ok?"ok":"ko"):"";
$("#lr").innerHTML=`<div class="rr"><span class="tot ${cl}">${r.sum}</span><div><b>${E(label)}</b>${r.res?` <span class="stamp ${cl}">${r.res}</span>`:""}<br>${r.raw.map((v,i)=>`<i class="dc${r.r[i]?"":" x"}">${v}</i>`).join("")}${r.pv?`<i class="dc pv">${r.pv}</i>`:""}<small>${r.ds.join("+")} · RA ${r.RA} · RB ${r.RB}${r.dt?" · DT "+r.dt:""}</small>${r.dano!=null?`<br>Dano <b>${r.dano}</b>${r.crit&&op.dmg==="ra"?" (crítico: soma as duas maiores)":""}`:""}</div></div>`;
anunciar(`${o.nome} · ${label}: ${r.sum}${r.res?" ("+r.res+")":""}${r.dano!=null?" · dano "+r.dano:""} [${r.raw.join(", ")}]`,r.res?(r.ok?"SUCCESS":"ERROR"):"DEFAULT",$("#oc").checked);
draw()};
const draw=()=>{
o=(R[K]||{})[id]||Object.values(R[K]||{}).find(x=>x.nome===n);
if(!o){$("#ft").innerHTML=`<p class="pad">Ficha não encontrada. Ela foi apagada ou ainda está carregando.</p>`;return}
document.querySelector(".tp b").textContent=o.nome||"Ficha";
if(!pf){pf=1;img(c,K,o.id||id).then(m=>{ph=m&&m.img||"";if(ph)draw()}).catch(()=>{})}
const lv=+o.nivel||0,V=vit(o,ch),sc=o.s||{};
const vt=(l,[f,m],z)=>m>0?`<div class="vt"><b>${l}</b><button data-a="${f}" data-d="-1" aria-label="${l} menos 1">−</button><div class="g"><div class="bar"><i style="width:${Math.max(0,Math.min(100,(+o[f]||0)/m*100))}%;background:${z}"></i></div></div><button data-a="${f}" data-d="1" aria-label="${l} mais 1">+</button><span>${+o[f]||0}/${m}</span></div>`:"";
const sec=(t,h)=>h?`<h3>${t}</h3>${h}`:"";
const nomes=ch?Object.keys(SKA).sort((a,b)=>a.localeCompare(b,"pt")):Object.keys(sc);
const sk=nomes.map(x=>`<button class="ch${ch&&sc[x]&&sc[x]!=="d4"?" tr":""}" data-r="s" data-n="${E(x)}">${E(x)} ${o[SKA[x]||"fis"]}+${sc[x]||"d4"}</button>`).join("")+(ch?Object.entries(o.ap||{}).filter(([,d])=>d&&d!=="d4").map(([x,d])=>`<button class="ch tr" data-r="p" data-n="${E(x)}">Aptidão (${E(x)}) ${o.men}+${d}</button>`).join("")+`<button class="ch" data-r="u">Desarmado</button>`:"");
const at=ar(o.atq).map((a,j)=>`<button class="ch" data-r="a" data-j="${j}">${E(a.n||"Ataque")} ${o[SKA[a.sk]||"fis"]}+${sc[a.sk]||"d4"}${a.mod?" +"+a.mod:""}</button>`).join("");
const hb=ar(o.habs).map(h=>`<details><summary>${E(h.nome)}</summary><small>${E(h.desc)}</small></details>`).join("")+(o.hab?`<p class="nt">${E(o.hab)}</p>`:"");
const it=ar(o.itens).map((i,j)=>i.tipo==="Arma corpo a corpo"||i.tipo==="Arma à distância"?`<button class="ch" data-r="w" data-j="${j}" title="${E(i.desc)}">${E(i.nome)} +${+i.mod||0}</button>`:`<span class="ch" title="${E(i.desc)}">${E(i.nome)}</span>`).join("");
const meta=h=>{const pa=+h.pa,ef=pa&&+o.nex>=50&&h.elem&&h.elem===o.elem;return[h.elem&&h.elem!=="Nenhum"?h.elem:"",pa?"PA "+Math.max(0,pa-(ef?5:0)):h.circ?"Círculo "+h.circ:"",h.ver&&h.ver!=="Normal"?h.ver:"",h.custo?"Custo "+h.custo:""].filter(Boolean).map(E).join(" · ")};
const par=l=>ar(l).map(h=>`<details><summary>${E(h.nome)}${meta(h)?" · "+meta(h):""}</summary><small>${E(h.desc)}</small></details>`).join("");
const nt=o.lore||o.notas||"";
$("#ft").innerHTML=`<div class="fh" style="--el:${col(o)}"><div class="hd">${ph?`<img class="pt" src="${E(ph)}" alt="">`:""}<div><h1>${E(o.nome)}</h1><small>${ch?`Nível ${lv}${+o.nex?" · NEX "+(+o.nex)+"%":""} · ${E(o.perfil)}${o.voc?" · "+E(o.voc):""}${o.jog?" · "+E(o.jog):""}`:[E(o.papel||""),+o.nex?"NEX "+(+o.nex)+"%":""].filter(Boolean).join(" · ")}${o.elem&&o.elem!=="Nenhum"?" · "+E(o.elem):""}</small></div></div>${vt("PV",V.pv,"#e0525a")}${vt("PD",V.pd,"#5aa2ea")}<div class="at">${["fis","men","emo"].map(a=>`<div><small>${AT[a]}</small><b class="n">${o[a]}</b></div>`).join("")}</div>${sec("Ataques",at)}${sec("Perícias",sk)}${sec("Habilidades",hb)}${sec("Poderes paranormais",par(o.pod))}${sec("Rituais",par(o.rit))}${sec("Inventário",it)}${sec("Notas",nt?`<p class="nt">${E(nt)}</p>`:"")}</div>`};
app.onclick=async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
/* botões da barra: funcionam sempre, mesmo sem ficha carregada */
if("x" in d)return fechar();
if(d.dock!==undefined){try{localStorage.setItem(POS,d.dock)}catch{}if(d.dock==="")lsSet(XY,null);guardaUI();try{await abrirPop(qBase(),undefined,own)}catch{}return}
if("min" in d){try{if(!mini){h0=innerHeight;await OBR.popover.setHeight(POPS[own],44);$("#bd").hidden=true;document.body.classList.add("mini");mini=1;b.textContent="▢";b.title="Restaurar"}else{await OBR.popover.setHeight(POPS[own],h0);$("#bd").hidden=false;document.body.classList.remove("mini");mini=0;b.textContent="–";b.title="Minimizar"}}catch{}return}
if(!o||!c)return;
if(d.a){const f=d.a,m=vit(o,ch)[f==="pv"||f==="pva"?"pv":"pd"][1],v=Math.max(0,Math.min(m,(+o[f]||0)+ +d.d));o[f]=v;put(c,`${K}/${o.id||id}/${f}`,v);return draw()}
const sc=o.s||{},j=+d.j;
if(d.r==="s")go(d.n,o[SKA[d.n]||"fis"],sc[d.n]||"d4");
else if(d.r==="p")go(`Aptidão (${d.n})`,o.men,(o.ap||{})[d.n]||"d4");
else if(d.r==="u")go("Desarmado · Luta",o.fis,sc.Luta||"d4",{dmg:"rb"});
else if(d.r==="a"){const a=ar(o.atq)[j];go(a.n||"Ataque",o[SKA[a.sk]||"fis"],sc[a.sk]||"d4",{dmg:a.dm||"ra",mod:+a.mod||0})}
else if(d.r==="w"){const i=ar(o.itens)[j],s=i.tipo==="Arma à distância"?"Pontaria":"Luta";go(`${i.nome} · ${s}`,o[SKA[s]],sc[s]||"d4",{dmg:"ra",mod:+i.mod||0})}};
/* quem pode abrir: o mestre abre qualquer uma; o jogador, só as próprias fichas importadas */
const gm=(await OBR.player.getRole())==="GM";
if(!gm&&(k!=="pj"||!pj||pj!==meuPid())){corpo(`<p class="pad">Você só pode abrir as suas próprias fichas.</p>`);return}
c=k==="pj"?await ctxJog(pj):await ctxMestre();
if(!c){corpo(`<p class="pad">${k==="pj"?"O mestre ainda não configurou a sincronia.":"Este navegador não tem o código do mestre. Abra a aba Sincronia da extensão e informe o código."}</p>`);return}
corpo(`<div class="rb pad"><label>DT <input id="dt" type="number" min="0" placeholder="—"></label><label>Passos <select id="kk">${[-2,-1,0,1,2].map(x=>`<option${x?"":" selected"}>${x}</option>`).join("")}</select></label><label>Bônus <select id="bx"><option value="">—</option>${["d4","d6","d8","d10","d12"].map(x=>`<option>${x}</option>`).join("")}</select></label><label><input id="oc" type="checkbox"> só eu vejo</label></div><div id="lr"></div><div id="ft"><p class="pad">Carregando…</p></div>`);restauraUI();
const es=conectar(c,r=>{ok=1;R=r;draw()}),f=async()=>{if(!ok&&$("#ft"))$("#ft").innerHTML=`<p class="pad"><b>Não conectou.</b> ${E(await diag(c))}</p>`};es.onerror=f;setTimeout(f,8000)}

/* ===================== PAINEL DO JOGADOR ===================== */
const reduz=src=>new Promise(res=>{if(!src||!/^data:image\//.test(src))return res("");const i=new Image();i.onload=()=>{try{const s=Math.min(1,160/Math.max(i.width,i.height)),cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(i.width*s));cv.height=Math.max(1,Math.round(i.height*s));cv.getContext("2d").drawImage(i,0,0,cv.width,cv.height);res(cv.toDataURL("image/webp",.85))}catch{res("")}};i.onerror=()=>res("");i.src=src});
const limpa=(v,d=0)=>{if(d>6)return null;
if(Array.isArray(v))return v.slice(0,300).map(x=>limpa(x,d+1));
if(v&&typeof v==="object"){const o={};for(const[k,x]of Object.entries(v)){if(k==="img"||k==="gal")continue;o[k.replace(/[.$#\[\]\/]/g,"_").slice(0,100)]=limpa(x,d+1)}return o}
if(typeof v==="string")return v.slice(0,20000);
return typeof v==="number"||typeof v==="boolean"?v:null};
const ler=t=>{try{const r=JSON.parse(String(t).trim()),L=Array.isArray(r)?r:Array.isArray(r.fichas)?r.fichas:Array.isArray(r.chars)?r.chars:[r];
return L.filter(o=>o&&typeof o==="object"&&o.nome!==undefined&&/^d\d+$/.test(o.fis)&&/^d\d+$/.test(o.men)&&/^d\d+$/.test(o.emo)).slice(0,12)}catch{return[]}};
async function painelJogador(){
const pid=meuPid(),nm=await OBR.player.getName(),c=await ctxJog(pid);
if(!c){app.innerHTML=`<p class="pad">O mestre ainda não configurou a sincronia.</p>`;return}
let R={},es=null,lo=0,er="",msg="",cand=[],sure="";
const ls=()=>{if(!lo)return`<p class="pad">${er?`<b>Não conectou.</b> ${E(er)} <button data-rt="1">Tentar de novo</button>`:"<small>Conectando…</small>"}</p>`;
const L=Object.values(R.chars||{}).sort((a,b)=>String(a.nome).localeCompare(b.nome,"pt"));
return L.map(o=>{const v=vit(o,1).pv;return`<div class="r" style="--el:${col(o)}"><div><b>${E(o.nome)||"Sem nome"}</b><small>Nível ${+o.nivel||0} · ${E(o.perfil)} · PV ${+o[v[0]]||0}/${v[1]}</small></div><button data-o="${E(o.id)}">Abrir</button><button data-rm="${E(o.id)}">${sure===o.id?"Confirmar?":"Remover"}</button></div>`}).join("")||`<p class="pad"><small>Você ainda não importou nenhuma ficha.</small></p>`};
const cd=()=>cand.map((o,i)=>`<div class="r" style="--el:${col(o)}"><div><b>${E(o.nome)||"Sem nome"}</b><small>Nível ${+o.nivel||0} · ${E(o.perfil)}</small></div><button data-im="${i}">Importar</button></div>`).join("");
const pinta=()=>{if($("#ls"))$("#ls").innerHTML=ls()},nota=()=>{if($("#m"))$("#m").textContent=msg};
const con=()=>{if(es)es.close();lo=0;er="";const f=async()=>{if(lo)return;er=await diag(c);pinta()};es=conectar(c,r=>{R=r;lo=1;er="";pinta()});es.onerror=f;setTimeout(f,8000)};
app.innerHTML=`<div class="pad"><b>Suas fichas</b></div><div id="ls">${ls()}</div><div class="pad"><h3 style="margin-top:0">Importar ficha</h3><small>No site, abra a ficha e clique em “Copiar para o Owlbear”. Depois cole o texto aqui.</small><textarea id="imp" rows="4" placeholder="Cole aqui o texto copiado do site"></textarea></div><div id="cd"></div><p class="pad" id="m"></p>`;
app.oninput=e=>{if(e.target.id!=="imp")return;const t=e.target.value;cand=t.trim()?ler(t):[];msg=t.trim()&&!cand.length?"Não reconheci esse texto. Use o botão “Copiar para o Owlbear” do site.":"";$("#cd").innerHTML=cd();nota()};
app.onclick=async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
if(d.rt){con();pinta();return}
if(d.o){const o=(R.chars||{})[d.o];if(o)abrir("pj",o.id,o.nome,pid);return}
if(d.rm){if(sure!==d.rm){sure=d.rm;pinta();return}sure="";try{await del(c,`chars/${d.rm}`);await putImg(c,"chars",d.rm,null);msg="Ficha removida."}catch{msg="Não consegui remover."}pinta();nota();return}
if(d.im!==undefined){const o=cand[+d.im];if(!o)return;msg="Importando…";nota();
try{const id=pidSan(o.id)||Math.random().toString(36).slice(2,10),f=limpa(o);f.id=id;if(!norm(f.jog))f.jog=nm;
const foto=await reduz(o.img),r=await put(c,`chars/${id}`,f);if(!r.ok)throw new Error("o banco recusou ("+r.status+")");
await putImg(c,"chars",id,foto?{img:foto}:null);msg=`Importada: ${o.nome||"ficha"}.`;cand=[];$("#imp").value=""}catch(x){msg="Não consegui importar: "+(x&&x.message||x)}
$("#cd").innerHTML=cd();nota()}};
con()}

/* ===================== PAINEL DO MESTRE ===================== */
async function painelMestre(){
let s=await cfgSala(),g=lerG(),c=await ctxMestre(),cp=await ctxTodos(),R={},RP={},es=null,esp=null,lo=0,lop=0,er="",msg="",q="",conf="",fu=null,fg=null;
let tab=c?"chars":"cfg";
const itens=()=>{const L=[];
if(tab==="chars"){for(const[p,v]of Object.entries(RP||{}))Object.values((v&&v.chars)||{}).forEach(o=>L.push({o,k:"pj",p}));Object.values(R.chars||{}).forEach(o=>L.push({o,k:"chars",p:""}))}
else Object.values(R[tab]||{}).forEach(o=>L.push({o,k:tab,p:""}));
return L.filter(x=>!q||norm(x.o.nome+" "+(x.o.papel||"")+" "+(x.o.jog||"")).includes(q)).sort((a,b)=>String(a.o.nome).localeCompare(b.o.nome,"pt"))};
const key=x=>`${x.k}|${x.p}|${x.o.id}`;
const sub=x=>x.k==="pj"?`Jogador${x.o.jog?": "+E(x.o.jog):""} · Nível ${+x.o.nivel||0} · ${E(x.o.perfil)}`:x.k==="chars"?`Mestre · Nível ${+x.o.nivel||0} · ${E(x.o.perfil)}`:E(x.o.papel||"");
const ls=()=>{
if(tab!=="chars"&&!c)return`<p class="pad"><small>Informe o código do mestre na aba Sincronia para ver ${KN[tab]}.</small></p>`;
const ok=tab==="chars"?(lo||lop):lo;
if(!ok)return`<p class="pad">${er?`<b>Não conectou.</b> ${E(er)} <button data-rt="1">Tentar de novo</button>`:"<small>Conectando…</small>"}</p>`;
return itens().map(x=>{const v=vit(x.o,x.k!=="monstros"&&x.k!=="npcs").pv;return`<div class="r" style="--el:${col(x.o)}"><div><b>${E(x.o.nome)||"Sem nome"}</b><small>${sub(x)} · PV ${+x.o[v[0]]||0}/${v[1]}</small></div><button data-v="${E(key(x))}">Vincular</button><button data-o="${E(key(x))}">Abrir</button></div>`}).join("")||`<p class="pad"><small>${tab==="chars"?"Nenhuma ficha ainda. Os jogadores importam as deles pela extensão; as suas você cria no site.":"Nada aqui ainda. Crie fichas no site."}</small></p>`};
const pinta=()=>{if(tab!=="cfg"&&$("#ls"))$("#ls").innerHTML=ls()};
const con=()=>{if(es)es.close();if(esp)esp.close();es=esp=null;lo=lop=0;er="";
if(c){const f=async()=>{if(lo)return;er=await diag(c);pinta()};es=conectar(c,r=>{R=r;lo=1;er="";pinta()});es.onerror=f;setTimeout(f,8000)}
if(cp){const f=async()=>{if(lop||lo||er)return;er=await diag(cp);pinta()};esp=conectar(cp,r=>{RP=r;lop=1;er="";pinta()});esp.onerror=f;setTimeout(f,8000)}};
const cfgHtml=()=>`<div class="pad">${s&&!c?`<p><b>Falta o código do mestre neste navegador.</b> Se você já usava a sincronia antes, escolha um código novo: o antigo foi compartilhado com os jogadores.</p>`:""}<p>Cole a URL do seu Realtime Database (Firebase) e escolha o <b>código do mestre</b>: um código secreto, só seu. Use o mesmo código no site (aba Backup e sincronia).</p><label>URL do banco<input id="cu" value="${E(fu??(s?s.u:""))}" placeholder="https://…firebaseio.com"></label><label>Código do mestre (secreto, mínimo 8 caracteres)<input id="cm" autocomplete="off" value="${E(fg??g)}"></label><p><button data-s="1">Salvar para a sala</button> <button data-gen="1">Gerar código</button></p><p><small>Os jogadores recebem só um código derivado deste, que dá acesso apenas às fichas que eles mesmos importam. Seus monstros, NPCs e fichas ficam só com você.</small></p><details><summary>Regras do Firebase</summary><p><small>No Firebase Console, abra Realtime Database → Regras, cole o texto abaixo e clique em Publicar.</small></p><textarea rows="9" readonly>${E(RULES)}</textarea></details></div>`;
const draw=()=>{app.innerHTML=`<div class="tb">${Object.keys(KN).map(k=>`<button class="t${k===tab?" on":""}" data-t="${k}">${KN[k]}</button>`).join("")}<button class="t${tab==="cfg"?" on":""}" data-t="cfg">Sincronia</button></div>`+
(tab==="cfg"?cfgHtml():`<div class="pad"><input id="q" placeholder="Buscar…" value="${E(q)}"><p><small>Selecione um token e clique em Vincular. Depois é só clicar no token.</small> <button data-u="1">Desvincular selecionado</button></p></div><div id="ls">${ls()}</div>`)+`<p class="pad" id="m">${E(msg)}</p>`};
app.onclick=async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
if(d.t){tab=d.t;msg="";return draw()}
if(d.rt){con();pinta();return}
if(d.gen){const a=new Uint8Array(16);crypto.getRandomValues(a);fg=[...a].map(x=>(x%36).toString(36)).join("");$("#cm").value=fg;return}
if(d.s){const u=$("#cu").value.trim().replace(/\/+$/,""),g2=$("#cm").value.trim().replace(/[^\w-]/g,"");
if(!/^https:\/\//.test(u)||g2.length<8){msg="Preencha a URL (https://…) e um código de pelo menos 8 caracteres (letras, números ou hífen).";return draw()}
try{const m2=await pubDe(g2);
if(s&&s.m&&s.m!==m2&&conf!==g2){conf=g2;msg="Este código é diferente do usado antes: os jogadores precisarão importar as fichas de novo. Clique em Salvar para a sala outra vez para confirmar.";return draw()}
await OBR.room.setMetadata({[KC]:{u,m:m2}});salvarG(g2);conf="";fu=fg=null;s={u,m:m2};g=g2;c=await ctxMestre();cp=await ctxTodos();con();tab="chars";
msg=lerG()===g2?"Salvo. O código do mestre ficou só neste navegador; a sala recebeu apenas o código derivado.":"Salvo na sala, mas o navegador não guardou o código do mestre: você precisará informá-lo de novo da próxima vez."}
catch{msg="Não consegui salvar. Tente de novo."}
return draw()}
if(d.o){const x=itens().find(z=>key(z)===d.o);if(x)abrir(x.k,x.o.id,x.o.nome,x.p);return}
if(d.v||d.u){try{const sel=await OBR.player.getSelection();
if(!sel||!sel.length)msg="Selecione um token no mapa primeiro.";
else if(d.u){await OBR.scene.items.updateItems(sel,xs=>xs.forEach(x=>{delete x.metadata[KL]}));msg="Vínculo removido."}
else{const x=itens().find(z=>key(z)===d.v);if(!x)return;await OBR.scene.items.updateItems(sel,xs=>xs.forEach(t=>{t.metadata[KL]={k:x.k,id:x.o.id,n:x.o.nome,p:x.p}}));msg=`${x.o.nome} vinculado a ${sel.length} token(s).`}}catch{msg="Abra uma cena e selecione um token."}draw()}};
app.oninput=e=>{const i=e.target.id;if(i==="q"){q=norm(e.target.value);$("#ls").innerHTML=ls()}else if(i==="cu")fu=e.target.value;else if(i==="cm")fg=e.target.value};
con();draw()}

async function panel(){return(await OBR.player.getRole())==="GM"?painelMestre():painelJogador()}
OBR.onReady(()=>Q.get("v")==="f"?ficha():panel());
</script>
